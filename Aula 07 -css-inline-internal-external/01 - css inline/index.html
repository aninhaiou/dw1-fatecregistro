<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inline</title>
</head>

<body>
    <h1>Demonstração de CSS Inline</h1>
    <p style="color:blue; font-size: 24px;">Este parágrafo utiliza CSS Inline através do atributo style.</p>
    <p style="color: rgb(94, 3, 18);
     font-weight: bold;
     background-color: rgb(223, 128, 157);">Outro parágrafo com múltiplas propriedades CSS Inline.
    </p>

    <!-- padding: espaçamento interno / margin: espaçamento externo -->
    <div style="border: 2px solid green; width: 400px; padding: 30px; margin: 50px;">
        Esta é uma div estilizada com CSS Inline.
    </div>

    <h2 style="color: #774af5; text-align: center;">
        Título centralizado com cor hexadecimal
    </h2>

    <div
        style="color: white; height: 400px; width: 600px; background-color: orangered; font-size: 32px; text-align: center;">
        Desafio CSS Inline.
    </div>
</body>
</html>
