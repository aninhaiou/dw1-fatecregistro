<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direções e Alinhamentos - Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Flexbox - Direções e Alinhamentos</h2>
    <p>Linha ao centro:</p>
    <div class="container row-center">
    <div class="card">A</div>
    <div class="card">B</div>
    <div class="card">C</div>
    </div>

    <p>Coluna à esquerda</p>
    <div class="container column-left">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
    </div>
    
    <p>Linha espaçada (space-between)</p>
    <div class="container row-space-between">
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
    </div>

    <p>Linha com espaço em volta</p>
    <div class="container row-space-around">
        <div class="card">D</div>
        <div class="card">E</div>
        <div class="card">F</div>
    </div>

    <p>Quebra de linha (flex-wrap)</p>
    <div class="container flex-wrap">
        <div class="card cardMaior">Card D</div>
        <div class="card cardMaior">Card E</div>
        <div class="card cardMaior">Card F</div>
        <div class="card cardMaior">Card G</div>
        <div class="card cardMaior">Card H</div>
        <div class="card cardMaior">Card I</div>
        <div class="card cardMaior">Card J</div>
        <div class="card cardMaior">Card K</div>
        <div class="card cardMaior">Card L</div>
    </div>
</body>
</html>
