<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>

</head>

<body>
    <h1>Formulários no HTML5</h1>
    <form action="#" method="POST">
        <label for="nome">Nome:</label><br>
        <!-- Input text -->
        <input type="text" id="nome" placeholder="Insira seu nome completo..." required><br>
        <!-- Input e-mail -->
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" placeholder="Insira seu e-mail..."><br>
        <!-- Input de senha -->
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" placeholder="Digite sua senha..."><br>
        <br><br>
        <!-- Botão de submeter o formulário -->
        <input type="submit" value="Cadastrar">
        <!-- Botão de limpar o formulário -->
        <input type="reset" value="Limpar">
    </form>
    <br><br>
    <hr>
    <h4>Outros Inputs:</h4>
    <form>
        <label>Quantidade:</label> <br>
        <!-- Inputs de números -->
        <input type="number" min="0" max="10"> <br>
        <!-- Input de números -->
        <labeL>Data:</label> <br>
        <input type="date"> <br><br>
        <!-- Input de arquivos -->
        <input type="file"> <br> <br>
        <!-- Campo de texto longo (textarea) -->
        <label>Comentários:</label> <br>
        <textarea rows="4" cols="40"></textarea>
        <!-- Campo invisível -->
        <input type="hidden" name="idProduto" value="9"> <br><br>
        <!-- Caixa de seleção -->
        <label>Cursos:</label><br>
        <select name="cursos">
            <option value="1">Programação</option>
            <option value="2">Design Gráfico</option>
            <option value="3">Música</option>
            <option value="4">Enfermagem</option>
        </select>
    </form>
    <br><br>
    <hr>
    <h2>Exemplo de formulário completo:</h2>
    <!-- Formulário Completo -->
    <h4>Cadastro do usuário</h4>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados pessoais:</legend>
            <label for="name">Nome:</label>
            <input type="text" placeholder="Insira seu nome..." id="name" name="name" required>
            <br>
            <label for="nascimento">Data de nascimento:</label>
            <input type="date"> <br>
            <label for="sexo">Sexo:</label>
            <!-- Radio buttons -->
             <input type="radio" name="sexo">Masculino
             <input type="radio" name="sexo">Feminino
             <input type="radio" name="sexo">Prefiro não informar
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados de endereço:</legend>
            <label>Cor do produto</label>
            <input type="color"><br><br>
            <!-- Checkbox -->
             <input type="checkbox" required>Li e aceito os termos de uso
             <br><br>
             <input type="text" placeholder="Este campo está desativado" disabled> <br><br>
             <input type="submit" value="Cadastrar">
             <input type="reset" value="Limpar">
        </fieldset>
    </form>
</body>

</html>
