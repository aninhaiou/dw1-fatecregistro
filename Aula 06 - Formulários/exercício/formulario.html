<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
</head>

<body>
    <h1>Cadastro de Aluno - DSM</h1>
    <p>Formulário para cadastro de alunos do curso de Desenvolvimento de Software Multiplataforma</p>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo</label><br />
            <input type="text" name="nome" id="nome" required /><br />
            <label for="email">E-mail</label><br />
            <input type="email" name="email" id="email" required /><br />
            <label for="data">Data de Nascimento</label><br />
            <input type="date" name="data" id="data" required />
        </fieldset>

        <fieldset>
            <legend>Dados Acadêmicos</legend>
            <label for="cursos">Curso:</label>
            <select name="cursos" id="cursos">
                <option value="1">DSM</option>
                <option value="2">ADS</option>
                <option value="3">ES</option>
                <option value="4">Outros</option>
            </select>
            <br />

            <p>Período:</p>
            <input type="radio" name="periodo" id="manha" value="manha" required />
            <label for="manha">Manhã</label>
            <input type="radio" name="periodo" id="noite" value="noite" />
            <label for="noite">Noite</label>
            <br />

            <label for="obs">Observações</label><br />
            <textarea rows="4" cols="30" name="obs" id="obs"></textarea>
            <br /><br />
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </fieldset>
    </form>
</body>

</html>
